<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescate Fotos</title>
<style>
body {
  margin: 0;
  padding: 25px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #38bdf8; }
.card {
  background: #1e293b;
  padding: 22px;
  margin: 15px 0;
  border-radius: 15px;
}
button {
  background: #0284c7;
  color: white;
  border: 0;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
}
input { margin-top: 15px; }
</style>
</head>
<body>
<h1>📱 Rescate Fotos</h1>
<p>Recupera y organiza tus archivos multimedia.</p>

<div class="card">
<h2>🖼️ Fotografías</h2>
<input type="file" accept="image/*" multiple>
</div>

<div class="card">
<h2>🎬 Vídeos</h2>
<input type="file" accept="video/*" multiple>
</div>

<div class="card">
<h2>📄 Documentos</h2>
<input type="file" accept=".pdf,.doc,.docx,.txt" multiple>
</div>

<p>Rescate Fotos - Primera versión</p>
</body>
  </html>
